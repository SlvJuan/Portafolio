<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>
    <link rel="stylesheet" href="/DOMS/006-DOM/css/style.css">
</head>
<body>
    <div class="stopWatch">
        <h1 class="time">00:00:00</h1>
        <div class="controls">
            <img src="/DOMS/006-DOM/imgs/stops.png" onclick="stopTimer()" alt="stop">
            <img src="/DOMS/006-DOM/imgs/stars.png" onclick="startTimer()" alt="start">
            <img src="/DOMS/006-DOM/imgs/resets.png" onclick="resetTimer()" alt="reset">
        </div>
    </div>
    <script src="/DOMS/006-DOM/js/script.js"></script>
</body>
</html>
